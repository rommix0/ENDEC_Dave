[workspace]
resolver = "2"
members = [
    "crates/armemu",
    "crates/loqhost",
    "crates/loqdave",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
